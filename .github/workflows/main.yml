name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check JavaScript syntax
        run: |
          set -e
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done
          python3 - <<'PY'
          import re, subprocess, sys, tempfile, os
          s = open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, re.S)
          if not blocks:
              sys.exit('index.html has no inline script')
          for i, b in enumerate(blocks):
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as t:
                  t.write(b)
              r = subprocess.run(['node', '--check', t.name], capture_output=True, text=True)
              os.unlink(t.name)
              if r.returncode:
                  sys.exit('Syntax error in inline script #%d:\n%s' % (i, r.stderr))
          print('index.html inline scripts OK')
          PY

      - name: Prepare web assets and inject modules
        run: |
          set -e
          mkdir -p www
          cp index.html manifest.webmanifest _headers www/ 2>/dev/null || cp index.html www/
          cp *.png www/ 2>/dev/null || true
          # PDF libraries used by the invoicing module
          echo '<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>' >> www/index.html
          echo '<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>' >> www/index.html
          FERT="fertilizer-pro.js"
          if [ ! -f "$FERT" ] && [ -f "fertil-pro.js" ]; then FERT="fertil-pro.js"; fi
          for f in bio-bridge.js invoicing.js ai-assistant.js pro-upgrade.js "$FERT" sme-dock.js; do
            if [ -f "$f" ]; then
              echo "Injecting $f"
              { echo "<script>"; cat "$f"; echo; echo "</script>"; } >> www/index.html
            else
              echo "::warning::$f not found, skipped"
            fi
          done
          grep -q "function rMap" www/index.html || { echo "::error::map page missing from index.html"; exit 1; }

      - name: Install Capacitor and add Android
        run: |
          set -e
          npm install --legacy-peer-deps
          npx cap add android
          npx cap sync android

      - name: Set app icon and permissions
        run: |
          set -e
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ] && [ -f "icon-512.png" ]; then
              cp icon-512.png "$dir/ic_launcher.png"
              cp icon-512.png "$dir/ic_launcher_round.png"
              cp icon-512.png "$dir/ic_launcher_foreground.png"
            fi
          done
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['INTERNET', 'USE_BIOMETRIC', 'USE_FINGERPRINT', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION',
                   'WRITE_EXTERNAL_STORAGE', 'READ_EXTERNAL_STORAGE', 'CAMERA']
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x
                        for x in perms if 'android.permission.%s"' % x not in s)
          if add:
              i = s.index('<application')
              s = s[:i] + add.lstrip() + '\n    ' + s[i:]
          open(p, 'w', encoding='utf-8').write(s)
          print('Manifest permissions ready')
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SME-Agri-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
